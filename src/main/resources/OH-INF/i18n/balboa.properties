# add-on

addon.balboa.name = Balboa Binding
addon.balboa.description = This binding integrates Balboa hot tub / spa control units connected over the local network (Wi-Fi module).

# thing types

thing-type.balboa.balboa-ip.label = Balboa IP Unit
thing-type.balboa.balboa-ip.description = Balboa Unit connected over IP

# thing types config

thing-type.config.balboa.balboa-ip.host.label = Host
thing-type.config.balboa.balboa-ip.host.description = The hostname or IP address of the Balboa Unit
thing-type.config.balboa.balboa-ip.pollingInterval.label = Polling Interval
thing-type.config.balboa.balboa-ip.pollingInterval.description = Number of seconds to between polling packets.
thing-type.config.balboa.balboa-ip.port.label = Port
thing-type.config.balboa.balboa-ip.port.description = The port to connect to, default is 4257.
thing-type.config.balboa.balboa-ip.reconnectInterval.label = Reconnect Interval
thing-type.config.balboa.balboa-ip.reconnectInterval.description = Number of seconds to wait before the first reconnect attempt. Further attempts back off exponentially (doubling each time, capped at 10 minutes) for as long as the connection stays down.
thing-type.config.balboa.balboa-ip.syncClock.label = Synchronize Clock
thing-type.config.balboa.balboa-ip.syncClock.description = Set the unit's clock to the openHAB time whenever it is off by more than one minute (checked on every status update, at most every five minutes). Keeps filter cycles on time across daylight saving changes.

