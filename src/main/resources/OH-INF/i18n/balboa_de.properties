channel-type.balboa.last-seen.label = Zuletzt gesehen
channel-type.balboa.last-seen.description = Zeitpunkt der letzten Nachricht der Steuerung, egal welcher Art. Nützlich, um eine stehengebliebene Verbindung zu erkennen, z. B. mit dem Expire-Binding/-Profil.
