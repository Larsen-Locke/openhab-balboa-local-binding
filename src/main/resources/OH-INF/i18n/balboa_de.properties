channel-type.balboa.heat-state.label = Heizstatus
channel-type.balboa.heat-state.description = Ob die Heizung aus ist, heizt oder auf das Heizen wartet.
channel-type.balboa.heat-state.state.option.OFF = Aus
channel-type.balboa.heat-state.state.option.HEATING = Heizt
channel-type.balboa.heat-state.state.option.HEAT_WAITING = Wartet auf Heizen
