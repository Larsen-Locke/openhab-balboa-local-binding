channel-type.balboa.filter.state.option.1 = Filter 1
channel-type.balboa.filter.state.option.2 = Filter 2
channel-type.balboa.filter.state.option.1+2 = Filter 1+2
channel-type.balboa.filter2-enabled-switch.label = Filter 2 (Schalter)
channel-type.balboa.filter2-enabled-switch.description = Schaltet den zweiten Filterzyklus ein (ON) oder aus (OFF). Filterzyklus 1 lässt sich nicht abschalten.
channel-type.balboa.filter2-enabled.label = Filter 2 aktiv
channel-type.balboa.filter2-enabled.description = Ob der zweite Filterzyklus überhaupt aktiv ist. Filterzyklus 1 lässt sich nicht abschalten.
channel-type.balboa.heat-mode-switch.label = Heizmodus (Schalter)
channel-type.balboa.heat-mode-switch.description = Heizmodus als einfacher Schalter (ON = Bereit, OFF = Ruhe/Bereit in Ruhe), um ein Switch-Item direkt ohne zweites Item und Profil zu verknüpfen.
