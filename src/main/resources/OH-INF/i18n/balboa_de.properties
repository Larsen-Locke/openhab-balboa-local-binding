channel-type.balboa.clear-notification.description = ON quittiert eine anstehende Erinnerung oder Meldung. Fällt danach auf OFF zurück.
channel-type.balboa.clock-24h.label = 24-Stunden-Uhr
channel-type.balboa.clock-24h.description = ON, wenn die Steuerung die Uhrzeit im 24-Stunden-Format anzeigt, OFF für 12 Stunden.
channel-type.balboa.clock-offset.label = Uhrabweichung
channel-type.balboa.clock-offset.description = Wie viele Minuten die Uhr der Steuerung der openHAB-Zeit voraus (positiv) oder hinterher (negativ) ist.
channel-type.balboa.current-temperature.label = Aktuelle Temperatur
channel-type.balboa.current-temperature.description = Aktuelle Temperatur
channel-type.balboa.fault-code.label = Letzter Fehler
channel-type.balboa.fault-code.description = Beschreibung des neuesten Eintrags im Fehlerspeicher der Steuerung, oder NONE, wenn er leer ist.
channel-type.balboa.fault-count.label = Anzahl Fehler
channel-type.balboa.fault-count.description = Anzahl der Einträge im Fehlerprotokoll der Steuerung.
channel-type.balboa.fault-time.label = Zeit letzter Fehler
channel-type.balboa.fault-time.description = Wann der neueste Fehler aufgetreten ist, z. B. "2 days ago at 14:32". Nach bestem Wissen: Die Steuerung meldet nur die Uhrzeit und vor wie vielen Tagen, kein genaues Datum.
channel-type.balboa.filter-cycle-time.label = Filterzyklus-Zeit
channel-type.balboa.filter-cycle-time.description = Startzeit oder Dauer eines Filterzyklus als HH:MM. Beschreibbar: HH:MM senden, um sie zu ändern (Dauer 00:15 bis 24:00).
channel-type.balboa.filter.label = Filterstatus
channel-type.balboa.filter.description = Filterstatus
