# add-on

addon.balboa.name = Balboa Binding
addon.balboa.description = Dieses Binding bindet Balboa-Whirlpool-/Spa-Steuerungen ein, die über das lokale Netzwerk (WLAN-Modul) verbunden sind.

# thing types

thing-type.balboa.balboa-ip.label = Balboa IP-Steuerung
thing-type.balboa.balboa-ip.description = Balboa-Steuerung, verbunden über IP

# thing types config

thing-type.config.balboa.balboa-ip.host.label = Host
thing-type.config.balboa.balboa-ip.host.description = Hostname oder IP-Adresse der Balboa-Steuerung
thing-type.config.balboa.balboa-ip.pollingInterval.label = Abfrageintervall
thing-type.config.balboa.balboa-ip.pollingInterval.description = Sekunden zwischen zwei Abfragepaketen.
thing-type.config.balboa.balboa-ip.port.label = Port
thing-type.config.balboa.balboa-ip.port.description = Port, mit dem verbunden wird, Standard ist 4257.
thing-type.config.balboa.balboa-ip.reconnectInterval.label = Wiederverbindungsintervall
thing-type.config.balboa.balboa-ip.reconnectInterval.description = Sekunden bis zum ersten Wiederverbindungsversuch. Weitere Versuche warten jeweils doppelt so lange (höchstens 10 Minuten), solange die Verbindung weg ist.
thing-type.config.balboa.balboa-ip.syncClock.label = Uhr synchronisieren
thing-type.config.balboa.balboa-ip.syncClock.description = Stellt die Uhr der Steuerung auf die openHAB-Zeit, sobald sie mehr als eine Minute abweicht (geprüft bei jeder Statusmeldung, höchstens alle fünf Minuten). Hält die Filterzyklen auch über die Zeitumstellung pünktlich.

